{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile - Cars Empire{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4">My Profile</h1>
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="list-group">
                <a href="{% url 'profile_details' %}" class="list-group-item list-group-item-action {% if active_tab == 'details' %}active{% endif %}" aria-current="true">
                    Account Details
                </a>
                <a href="{% url 'profile_vehicles' %}" class="list-group-item list-group-item-action {% if active_tab == 'vehicles' %}active{% endif %}">My Vehicles</a>
                <a href="{% url 'profile_orders' %}" class="list-group-item list-group-item-action {% if active_tab == 'orders' %}active{% endif %}">Order History</a>
                <a href="{% url 'profile_coupons' %}" class="list-group-item list-group-item-action {% if active_tab == 'coupons' %}active{% endif %}">My Coupons</a>
                <a href="#" onclick="api.auth.logout(); return false;" class="list-group-item list-group-item-action text-danger">Logout</a>
            </div>
        </div>
        <div class="col-md-9">
            <div id="profile-loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div id="profile-error" class="alert alert-danger d-none"></div>
            <div id="profile-content" class="d-none">
                {% block profile_content %}
                <!-- Profile section content goes here -->
                {% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/utils.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const profileLoading = document.getElementById('profile-loading');
    const profileError = document.getElementById('profile-error');
    const profileContent = document.getElementById('profile-content');
    
    try {
        // Check if user is logged in
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = "{% url 'login' %}";
            return;
        }
        
        // Get fresh user data
        const profile = await api.auth.getProfile();
        if (profile) {
            // Update user data in localStorage
            localStorage.setItem('user', JSON.stringify(profile));
            
            // Show profile content
            profileLoading.classList.add('d-none');
            profileContent.classList.remove('d-none');
            
            // Initialize profile content
            initializeProfileContent(profile);
        } else {
            throw new Error('Failed to load profile data');
        }
    } catch (error) {
        profileLoading.classList.add('d-none');
        profileError.classList.remove('d-none');
        profileError.textContent = error.message || 'Failed to load profile data';
    }
});

function initializeProfileContent(profile) {
    // This function will be overridden by child templates
    console.log('Profile data loaded:', profile);
}
</script>
{% endblock %}
