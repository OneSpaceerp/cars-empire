{% extends 'profile_base.html' %}
{% load static %}

{% block title %}Order History - My Profile - Cars Empire{% endblock %}

{% block profile_content %}
    <h4>Order History</h4>
    <hr>
    
    <div id="orders-list">
        <!-- Orders will be loaded here -->
    </div>

    <!-- Order Details Modal -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderDetailsModalLabel">Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="order-details-content">
                    <!-- Order details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
async function initializeProfileContent(profile) {
    await loadOrders();
    setupEventListeners();
}

async function loadOrders() {
    try {
        const orders = await api.orders.getAll();
        const ordersList = document.getElementById('orders-list');
        ordersList.innerHTML = '';
        
        if (orders.length === 0) {
            ordersList.innerHTML = '<div class="alert alert-info">No orders found.</div>';
            return;
        }
        
        const table = document.createElement('table');
        table.className = 'table table-hover';
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;
        
        const tbody = table.querySelector('tbody');
        orders.forEach(order => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${order.id}</td>
                <td>${new Date(order.created_at).toLocaleDateString()}</td>
                <td><span class="badge bg-${getStatusBadgeClass(order.status)}">${order.status}</span></td>
                <td>$${order.total.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary view-order" data-id="${order.id}">View Details</button>
                    ${order.status === 'pending' ? `
                        <button class="btn btn-sm btn-outline-danger cancel-order" data-id="${order.id}">Cancel</button>
                    ` : ''}
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        ordersList.appendChild(table);
    } catch (error) {
        console.error('Failed to load orders:', error);
        showError('Failed to load orders');
    }
}

function getStatusBadgeClass(status) {
    switch (status.toLowerCase()) {
        case 'completed':
            return 'success';
        case 'pending':
            return 'warning';
        case 'cancelled':
            return 'danger';
        case 'processing':
            return 'info';
        default:
            return 'secondary';
    }
}

async function loadOrderDetails(orderId) {
    try {
        const order = await api.orders.getById(orderId);
        const modalContent = document.getElementById('order-details-content');
        
        modalContent.innerHTML = `
            <div class="row">
                <div class="col-md-6">
                    <h6>Order Information</h6>
                    <p><strong>Order ID:</strong> #${order.id}</p>
                    <p><strong>Date:</strong> ${new Date(order.created_at).toLocaleString()}</p>
                    <p><strong>Status:</strong> <span class="badge bg-${getStatusBadgeClass(order.status)}">${order.status}</span></p>
                </div>
                <div class="col-md-6">
                    <h6>Payment Information</h6>
                    <p><strong>Payment Method:</strong> ${order.payment_method}</p>
                    <p><strong>Payment Status:</strong> ${order.payment_status}</p>
                </div>
            </div>
            <hr>
            <h6>Order Items</h6>
            <table class="table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    ${order.items.map(item => `
                        <tr>
                            <td>${item.name}</td>
                            <td>$${item.price.toFixed(2)}</td>
                            <td>${item.quantity}</td>
                            <td>$${(item.price * item.quantity).toFixed(2)}</td>
                        </tr>
                    `).join('')}
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                        <td><strong>$${order.total.toFixed(2)}</strong></td>
                    </tr>
                </tfoot>
            </table>
        `;
        
        const modal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
        modal.show();
    } catch (error) {
        console.error('Failed to load order details:', error);
        showError('Failed to load order details');
    }
}

function setupEventListeners() {
    document.addEventListener('click', async (e) => {
        if (e.target.classList.contains('view-order')) {
            const orderId = e.target.dataset.id;
            await loadOrderDetails(orderId);
        } else if (e.target.classList.contains('cancel-order')) {
            const orderId = e.target.dataset.id;
            if (confirm('Are you sure you want to cancel this order?')) {
                try {
                    await api.orders.cancel(orderId);
                    await loadOrders();
                } catch (error) {
                    console.error('Failed to cancel order:', error);
                    showError('Failed to cancel order');
                }
            }
        }
    });
}
</script>
{% endblock %}
