{% comment %} Reusable advert block for carousels and videos {% endcomment %}
{% if advert.images.all %}
  <div id="advertCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      {% for img in advert.images.all %}
        <div class="carousel-item {% if forloop.first %}active{% endif %}">
          <img src="{{ img.image.url }}" class="d-block w-100" alt="Advert Image">
        </div>
      {% endfor %}
    </div>
    {% if advert.images.count > 1 %}
      <button class="carousel-control-prev" type="button" data-bs-target="#advertCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#advertCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    {% endif %}
  </div>
{% endif %}
{% if advert.videos.all %}
  {% for vid in advert.videos.all %}
    <video class="w-100 my-2" controls>
      <source src="{{ vid.video.url }}">
      Your browser does not support the video tag.
    </video>
  {% endfor %}
{% endif %}
